name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: press
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        prune-cache: false
        cache-suffix: v1

    - name: Install dependencies
      run: uv sync

    - name: Install Just
      uses: extractions/setup-just@v1

    - name: Run linting
      run: just lint

    - name: Run unit tests
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/press
        TESTING: 1
      run: uv run pytest -m "not e2e"

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    timeout-minutes: 30
    # Playwright's image already has the browsers and every system library they need.
    # Installing them on the runner meant downloading about 181 packages from Ubuntu's
    # mirror in every job, which stalled for up to an hour when the mirror was slow.
    # Keep the tag in step with the playwright version in uv.lock (tests/test_ci_workflow.py).
    container:
      image: mcr.microsoft.com/playwright:v1.54.0-noble
    env:
      # Firefox refuses to start as root unless HOME belongs to root.
      HOME: /root

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop
            marker: "e2e and desktop and not flaky"
            browser: ""
            timeout: 240
          - name: mobile-webkit
            marker: "e2e and mobile and not flaky"
            browser: "--browser webkit"
            timeout: 240
          - name: mobile-chromium
            marker: "e2e and mobile and not flaky"
            browser: "--browser chromium"
            timeout: 240
          - name: universal
            marker: "e2e and not desktop and not mobile and not flaky"
            browser: ""
            timeout: 600

    name: e2e (${{ matrix.name }})

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: press
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        prune-cache: false
        cache-suffix: v1

    # python-magic needs libmagic, which the Playwright image does not include.
    - name: Install libmagic
      run: apt-get update -qq && apt-get install -y -qq --no-install-recommends libmagic1

    - name: Install Python 3.11
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync --python 3.11

    - name: Run database migrations
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/press
        TESTING: 1
      run: uv run alembic upgrade head

    - name: Seed database
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/press
        TESTING: 1
        PYTHONPATH: .
      run: uv run python scripts/seed.py

    - name: Start server
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/press
        TESTING: 1
        E2E_TESTING: 1
        PYTHONPATH: .
        PORT: 8000
      run: |
        uv run uvicorn main:app --host 0.0.0.0 --port 8000 --log-level info > server.log 2>&1 &
        sleep 8
        curl -f http://localhost:8000 || exit 1

    # Same database, with the content domain on, for tests/e2e/test_content_domain_e2e.py.
    - name: Start content domain server
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/press
        TESTING: 1
        E2E_TESTING: 1
        PYTHONPATH: .
        PORT: 8001
        CONTENT_DOMAIN: content.test
        BASE_URL: http://127.0.0.1:8001
      run: |
        uv run uvicorn main:app --host 0.0.0.0 --port 8001 --log-level info > content-server.log 2>&1 &
        sleep 8
        curl -f http://localhost:8001 || exit 1

    - name: Run e2e tests (${{ matrix.name }})
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/press
        TESTING: 1
      run: |
        timeout ${{ matrix.timeout }} uv run pytest -m "${{ matrix.marker }}" --tb=short -v ${{ matrix.browser }}

    - name: Show server log
      if: failure()
      run: cat server.log; cat content-server.log
